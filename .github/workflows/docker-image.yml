name: "Docker build and push"
on:
  push:
    paths:
      - php/**
jobs:
  build_push_images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        version: [ 8.3,8.4, 8.5 ]
        sapi: [ cli, fpm ]
        env: [ dev,prod ]
        variant: [ alpine ]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./php/${{ matrix.variant }}
          push: true
          tags: ${{ github.repository_owner }}/php:${{ matrix.version }}-${{ matrix.sapi }}-${{ matrix.variant }}-${{ matrix.env }}
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            SAPI=${{ matrix.sapi }}