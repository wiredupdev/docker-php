name: "Docker build and push"
on:
  push:
    branches: [ "master" ]
jobs:
  build_push_images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        version: [ 8.3,8.4, 8.5 ]
        SAPI: [ cli, fpm ]
        environment: [ dev,prod ]
        os: [ alpine, amazonlinux ]
        include:
          - os: alpine
            environment: dev
            stage: dev
          - os: alpine
            environment: prod
            stage: prod
          - os: amazonlinux
            environment: dev
            stage: dev_cli
            sapi: cli
          - os: amazonlinux
            environment: dev
            stage: prod_cli
            sapi: cli
          - os: amazonlinux
            environment: dev
            stage: dev_fpm
            sapi: fpm
          - os: amazonlinux
            environment: prod
            stage: prod_fpm
            sapi: fpm
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: build image
        run: |
          docker build --no-cache --target ${{matrix.stage}} --build-arg PHP_VERSION="${{matrix.version}}" SAPI=${{matrix.sapi}} -t ${{ github.repository_owner }}/php:${{matrix.version}}-${{matrix.os}}-${{matrix.environment}} ./${{matrix.os}}
      - name: push image
        run: |
          docker push ${{ github.repository_owner }}/\php:${{matrix.version}}-${{matrix.os}}-${{matrix.environment}}