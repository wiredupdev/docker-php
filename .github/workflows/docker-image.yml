name: "Docker build and push"
on:
  push:
    branches: [ "master" ]
jobs:
  build_push_images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        version: [ 8.3,8.4, 8.5 ]
        sapi: [ cli, fpm ]
        env: [ dev,prod ]
        variant: [alpine]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: build image
        run: |
          docker build --no-cache --target ${{matrix.env}} --build-arg PHP_VERSION="${{matrix.version}}" --build-arg SAPI="${{matrix.sapi}}" -t ${{ github.repository_owner }}/php:${{matrix.version}}-${{matrix.variant}}-${{matrix.env}} ./php/${{matrix.variant}}
      - name: push image
        run: |
          docker push ${{ github.repository_owner }}/\php:${{matrix.version}}-${{matrix.variant}}-${{matrix.env}}